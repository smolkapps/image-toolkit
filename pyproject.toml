[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-toolkit"
version = "0.1.0"
description = "Batch image processing CLI: convert, resize, strip metadata, rotate/flip, thumbnail, grayscale, watermark, montage, info. Built on Pillow. Zero network."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "smolkai", email = "smolkai@users.noreply.github.com" }]
keywords = ["image", "pillow", "cli", "batch", "convert", "resize", "exif", "watermark", "thumbnail"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
dependencies = [
    "Pillow>=9.1.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
image-toolkit = "image_toolkit.cli:main"
imgtk = "image_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/smolkapps/image-toolkit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
